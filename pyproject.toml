[project]
name = "mlops"
version = "0.0.1"
description = "MLOps platform for reproducible medical-imaging experiments"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
