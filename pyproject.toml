[project]
name = "mlops"
version = "0.0.1"
description = "MLOps platform for reproducible model-training experiments"
requires-python = ">=3.12"
# Core platform: framework-agnostic except for torch (the runner needs it).
# Install with `uv pip install -e ".[dev]" --torch-backend=auto` so uv picks
# the CPU wheel on the dev box and the matching CUDA wheel on GPU machines.
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "torch>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mlflow>=3.0",  # so the MLflow tracker tests run on the dev box
    "ray[train]>=2.40",  # so the Ray launcher tests run on the dev box
]
# Optional tracking backends. The core never imports them at module import time.
tracking = [
    "mlflow>=3.0",
]
# Distributed training via Ray Train; on Kubernetes the same code runs under a KubeRay RayJob.
distributed = [
    "ray[train]>=2.40",
]
# Domain-specific extras used by models under experiments/, never by mlops/.
medical = [
    "monai>=1.6",
    "einops>=0.8",  # MONAI optional dep, required by SwinUNETR.forward
    "nibabel>=5.3",  # MONAI LoadImage reader for NIfTI (msd-task09-spleen)
]

[project.scripts]
mlops = "mlops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
