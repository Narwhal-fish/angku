# Phase 0 baseline. Placeholder commit / digest / snapshot values are
# syntactically valid pins; they get replaced by real ones once the code,
# image and dataset snapshot exist.

meta:
  name: swinunetr-baseline
  description: SwinUNETR on a public 3D segmentation dataset, single GPU
  tags: [baseline, swinunetr, phase0]

code:
  repo: https://github.com/example/mlManager
  commit: 0123456789abcdef0123456789abcdef01234567

environment:
  image: ghcr.io/example/mlops-train:0.1.0
  image_digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

dataset:
  name: msd-task09-spleen
  version: v1
  # Placeholder: not a content hash, so the run records dataset.snapshot "unknown".
  # Pin the real value with: mlops snapshot <this yaml> --data-root DIR
  snapshot: dvc:8d1f2c3a4b5e6f7081920a1b2c3d4e5f

# Validated by experiments/datasets/msd_spleen.py (SpleenPreprocessing). Every field is
# spelled out: defaults are not in the fingerprint, explicit values are.
preprocessing:
  spacing: [1.5, 1.5, 2.0]
  intensity_range: [-57, 164]
  roi_size: [96, 96, 96]
  num_val: 9             # last 9 cases by file name are validation
  pos: 1                 # train crops: pos:neg odds of centring on a spleen voxel
  neg: 1
  val: full_volume       # validate on whole cases (needs `inference` below), not one crop

model:
  name: swinunetr
  params:
    in_channels: 1
    out_channels: 2
    feature_size: 48
    use_checkpoint: true

training:
  epochs: 100
  batch_size: 4          # global effective batch; runner splits by world_size
  learning_rate: 1.0e-4
  optimizer: adamw
  seed: 42

augmentation:
  - name: rand_flip
    params: {prob: 0.5, spatial_axis: [0, 1, 2]}
  - name: rand_rotate90
    params: {prob: 0.1, max_k: 3}

loss:
  name: dice_ce
  params: {to_onehot_y: true, softmax: true}

# Validation metrics beyond val/loss, logged as val/<key>. Background is not scored.
metrics:
  - name: dice
    params: {include_background: false, class_names: [background, spleen]}

# How the model sees a validation volume: MONAI sliding window over the whole case,
# windows of the training roi. Every param explicit (defaults are not in the fingerprint).
inference:
  name: sliding_window
  params:
    roi_size: [96, 96, 96]
    sw_batch_size: 4
    overlap: 0.25
    mode: constant
    sigma_scale: 0.125
    padding_mode: constant
    cval: 0.0

resources:
  gpu: 1
  cpu: 8
  memory: 32Gi

tracking:
  backend: mlflow
  experiment_name: spleen-segmentation
  uri: http://localhost:5000
